syntax = "proto3";
package verana.poa.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/protobuf/any.proto";

option go_package = "github.com/verana-labs/verana-node/x/poa/types";

// Msg defines the poa Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // AddValidator seats a council member as a validator with the fixed bond.
  rpc AddValidator(MsgAddValidator) returns (MsgAddValidatorResponse);
  // RemoveValidator unseats a validator and burns its bond.
  rpc RemoveValidator(MsgRemoveValidator) returns (MsgRemoveValidatorResponse);
  // SelfRemoveValidator lets an operator unseat its own validator.
  rpc SelfRemoveValidator(MsgSelfRemoveValidator) returns (MsgSelfRemoveValidatorResponse);
}

// Description mirrors cosmos.staking.v1beta1.Description without importing it.
message Description {
  string moniker = 1;
  string identity = 2;
  string website = 3;
  string security_contact = 4;
  string details = 5;
}

message MsgAddValidator {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "verana/x/poa/MsgAddValidator";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string validator_address = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Description description = 3 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
  google.protobuf.Any pubkey = 4 [(cosmos_proto.accepts_interface) = "cosmos.crypto.PubKey"];
}

message MsgAddValidatorResponse {}

message MsgRemoveValidator {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "verana/x/poa/MsgRemoveValidator";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string validator_address = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message MsgRemoveValidatorResponse {}

message MsgSelfRemoveValidator {
  option (cosmos.msg.v1.signer) = "validator_address";
  option (amino.name) = "verana/x/poa/MsgSelfRemoveValidator";

  string validator_address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message MsgSelfRemoveValidatorResponse {}
