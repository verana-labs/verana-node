syntax = "proto3";
package verana.de.v1;

import "cosmos/base/v1beta1/coin.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/verana-labs/verana-node/x/de/types";

// OperatorAuthorization is the operator-delegation record. Per spec it is
// keyed by its own uint64 id; (corporation_id, operator) is a unique secondary
// index.
message OperatorAuthorization {

  // id is the own uint64 key of this OperatorAuthorization.
  uint64 id = 1;
  // corporation_id is the id of the corporation granting the authorization. The
  // (corporation_id, operator) tuple MUST be unique.
  uint64 corporation_id = 2;
  // operator is the account receiving the authorization.
  string operator = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // msg_types is the list of module message types this authorization applies to.
  repeated string msg_types = 4;
  // spend_limit is the maximum amount of funds the grantee is allowed to spend.
  repeated cosmos.base.v1beta1.Coin spend_limit = 5 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // remaining_spend is the runtime balance for spend_limit. Present iff
  // spend_limit is set.
  repeated cosmos.base.v1beta1.Coin remaining_spend = 6 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // expiration is the timestamp after which the authorization is no longer
  // valid.
  google.protobuf.Timestamp expiration = 9 [(gogoproto.stdtime) = true];
  // period is the reset period for spend_limit. If set, expiration MUST also be set.
  google.protobuf.Duration period = 10 [(gogoproto.stdduration) = true];
}

// FeeGrant is the chain-level fee allowance, keyed by the composite
// (grantor_corporation_id, grantee).
message FeeGrant {

  // grantor_corporation_id is the id of the corporation granting the fee
  // allowance. Together with grantee it forms the composite key.
  uint64 grantor_corporation_id = 1;
  // grantee is the account that receives the fee grant from grantor.
  string grantee = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // msg_types is the list of VPR delegable message types for which the fee
  // allowance applies.
  repeated string msg_types = 3;
  // spend_limit is the maximum amount of fees that can be spent using this grant.
  repeated cosmos.base.v1beta1.Coin spend_limit = 4 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // remaining_spend is the runtime balance for spend_limit. Present iff
  // spend_limit is set.
  repeated cosmos.base.v1beta1.Coin remaining_spend = 5 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // expiration is the timestamp after which the fee grant is no longer valid.
  google.protobuf.Timestamp expiration = 6 [(gogoproto.stdtime) = true];
  // period is the reset period for spend_limit. If set, expiration MUST also be
  // set.
  google.protobuf.Duration period = 7 [(gogoproto.stdduration) = true];
}

// ParticipantAuthorizationRecord is a per-participant VS-operator authorization
// nested inside a VSOperatorAuthorization. Keyed by participant_id, which is
// globally unique across all records of all VSOperatorAuthorizations.
message ParticipantAuthorizationRecord {
  // participant_id is the id of the Participant this record applies to. Globally
  // unique across all ParticipantAuthorizationRecord entries.
  uint64 participant_id = 1;
  // msg_types is the list of delegable message types the vs_operator is
  // authorized for on behalf of corporation. Mandatory, frozen at create.
  repeated string msg_types = 2;
  // spend_limit is the maximum amount the vs_operator is allowed to spend.
  repeated cosmos.base.v1beta1.Coin spend_limit = 3 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // remaining_spend is the runtime balance for spend_limit. Present iff
  // spend_limit is set.
  repeated cosmos.base.v1beta1.Coin remaining_spend = 4 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // fee_spend_limit is this record's contribution to the aggregate fee
  // allowance of vs_operator, per Params.vs_operator_fee_period. Set iff
  // with_feegrant is true; every amount is strictly positive.
  repeated cosmos.base.v1beta1.Coin fee_spend_limit = 5 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // Field 6 (remaining_fee_spend) was removed: the fee cap is enforced by the
  // aggregate x/feegrant allowance, not per record.
  reserved 6;
  // with_feegrant indicates the corporation pays the transaction fees for
  // vs_operator.
  bool with_feegrant = 7;
  // expiration is the end of the current operation-budget cycle. Set iff period
  // is set and the cycle has started; it carries no window semantics.
  google.protobuf.Timestamp expiration = 8 [(gogoproto.stdtime) = true];
  // period is the length of the operation-budget cycle for spend_limit.
  google.protobuf.Duration period = 9 [(gogoproto.stdduration) = true];
}

// WindowEndQueueEntry is a due date of the window-end queue: the Participant
// entry's effective_until, at which the aggregate fee allowance of the
// containing VSOperatorAuthorization is recomputed.
message WindowEndQueueEntry {
  google.protobuf.Timestamp window_end = 1 [
    (gogoproto.stdtime) = true,
    (gogoproto.nullable) = false
  ];
  uint64 participant_id = 2;
}

// VSOperatorAuthorization is the VS-operator delegation, keyed by its own uint64
// id; (corporation_id, vs_operator) is a unique secondary index. The entry
// exists iff it has at least one record.
message VSOperatorAuthorization {
  // Field 1 (`string corporation`) and field 3 (`repeated uint64 permissions`)

  // id is the own uint64 key of this VSOperatorAuthorization.
  uint64 id = 1;
  // corporation_id is the id of the corporation granting the authorization. The
  // (corporation_id, vs_operator) tuple MUST be unique.
  uint64 corporation_id = 2;
  // vs_operator is the operator account receiving the authorization.
  string vs_operator = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // records is the list of per-participant authorization records granted to
  // vs_operator by corporation_id.
  repeated ParticipantAuthorizationRecord records = 4 [(gogoproto.nullable) = false];
}
