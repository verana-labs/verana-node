syntax = "proto3";
package verana.de.v1;

import "amino/amino.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "verana/de/v1/msg_type.proto";

option go_package = "github.com/verana-labs/verana-node/x/de/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // [MOD-DE-MSG-3] Grant Delegate Authorization
  rpc GrantDelegateAuthorization(MsgGrantDelegateAuthorization) returns (MsgGrantDelegateAuthorizationResponse);

  // [MOD-DE-MSG-4] Revoke Delegate Authorization
  rpc RevokeDelegateAuthorization(MsgRevokeDelegateAuthorization) returns (MsgRevokeDelegateAuthorizationResponse);
}

// [MOD-DE-MSG-3] MsgGrantDelegateAuthorization grants a delegate authorization
// to a grantee on behalf of a corporation.
//
// The signer is `delegate`. On the group-proposal path the corporation's
// policy account executes the message and `delegate` equals `corporation`;
// only AUTHZ-CHECK-5 then applies.
message MsgGrantDelegateAuthorization {
  option (cosmos.msg.v1.signer) = "delegate";
  option (amino.name) = "verana/x/de/MsgGrantDelegateAuthz";

  // corporation is the policy_address of the corporation granting the authorization.
  string corporation = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // delegate is the signer: an authorized delegate, or the corporation's
  // policy_address itself on the group-proposal path.
  string delegate = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // grantee is the account that receives the authorization from corporation.
  string grantee = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // msg_types is the list of VPR delegable message types for which
  // authorization is granted.
  repeated MsgType msg_types = 4;
  // expiration is the optional timestamp after which the authorization expires.
  google.protobuf.Timestamp expiration = 5 [
    (gogoproto.stdtime) = true,
    (gogoproto.nullable) = true
  ];
  // authz_spend_limit is the optional maximum spendable amount.
  repeated cosmos.base.v1beta1.Coin authz_spend_limit = 6 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // authz_spend_limit_period is the optional reset period for
  // authz_spend_limit.
  google.protobuf.Duration authz_spend_limit_period = 7 [
    (gogoproto.stdduration) = true,
    (gogoproto.nullable) = true
  ];
  // with_feegrant indicates whether to also grant a fee allowance.
  bool with_feegrant = 8;
  // feegrant_spend_limit is the optional maximum fee amount. Ignored if
  // with_feegrant is false.
  repeated cosmos.base.v1beta1.Coin feegrant_spend_limit = 9 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // feegrant_spend_limit_period is the optional reset period for
  // feegrant_spend_limit. Ignored if with_feegrant is false.
  google.protobuf.Duration feegrant_spend_limit_period = 10 [
    (gogoproto.stdduration) = true,
    (gogoproto.nullable) = true
  ];
}

// MsgGrantDelegateAuthorizationResponse defines the response for
// MsgGrantDelegateAuthorization.
message MsgGrantDelegateAuthorizationResponse {}

// [MOD-DE-MSG-4] MsgRevokeDelegateAuthorization revokes a delegate
// authorization for a grantee on behalf of a corporation. Same signer
// semantics as MsgGrantDelegateAuthorization (see above).
message MsgRevokeDelegateAuthorization {
  option (cosmos.msg.v1.signer) = "delegate";
  option (amino.name) = "verana/x/de/MsgRevokeDelegateAuthz";

  // corporation is the policy_address of the corporation revoking the authorization.
  string corporation = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // delegate is the signer: an authorized delegate, or the corporation's
  // policy_address itself on the group-proposal path.
  string delegate = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // grantee is the account whose authorization is being revoked.
  string grantee = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgRevokeDelegateAuthorizationResponse defines the response for
// MsgRevokeDelegateAuthorization.
message MsgRevokeDelegateAuthorizationResponse {}
