syntax = "proto3";
package verana.td.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/verana-labs/verana-node/x/td/types";

// Params holds the Trust Deposit and Trust Unit Index, Native denom and
// Network fees groups of GlobalVariables.
message Params {
  option (amino.name) = "verana/x/td/Params";
  option (gogoproto.equal) = true;

  string trust_deposit_rate = 1 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  // immutable
  string main_fiat_currency = 2;
  // immutable
  string tu_peg_value_genesis = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  // the rate in force; an update that sends another value stores it as pending
  // until the next epoch boundary, one that sends this rate keeps a pending value
  string tu_decay_rate = 4 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  // immutable
  google.protobuf.Duration epoch_length = 5 [
    (gogoproto.nullable) = false,
    (gogoproto.stdduration) = true
  ];
  string vua_reward_rate = 6 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  // immutable
  uint64 vna_total_supply = 7;
  string network_gas_price = 8 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  // one entry per protobuf type URL
  repeated MaxGasEntry max_gas_per_msg_type = 9 [(gogoproto.nullable) = false];
}

// MaxGasEntry is one entry of the max_gas_per_msg_type map.
message MaxGasEntry {
  option (gogoproto.equal) = true;

  string msg_type_url = 1;
  uint64 max_gas = 2;
}
