syntax = "proto3";
package verana.gf.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/verana-labs/verana-node/x/gf/types";

// Params defines the parameters for the x/gf module.
message Params {
  option (amino.name) = "verana/x/gf/Params";
  option (gogoproto.equal) = true;

  google.protobuf.Duration gf_acceptance_grace_min = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.stdduration) = true
  ];
}
