syntax = "proto3";
package verana.gf.v1;

import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/verana-labs/verana-node/x/gf/types";

// GovernanceFrameworkVersion represents a versioned governance framework owned
// by an Ecosystem (ecosystem_id set), a Corporation (corporation_id set), or the
// network when neither is set.
message GovernanceFrameworkVersion {
  uint64 id = 1;
  uint64 ecosystem_id = 2;
  uint64 corporation_id = 3;
  google.protobuf.Timestamp created = 4 [
    (gogoproto.stdtime) = true,
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  uint32 version = 5;
  google.protobuf.Timestamp active_since = 6 [
    (gogoproto.stdtime) = true,
    (gogoproto.nullable) = true
  ];
}

// GovernanceFrameworkDocument is a single (language, url, digest_sri) tuple
// attached to a GovernanceFrameworkVersion.
message GovernanceFrameworkDocument {
  uint64 id = 1;
  uint64 gfv_id = 2;
  google.protobuf.Timestamp created = 3 [
    (gogoproto.stdtime) = true,
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string language = 4;
  string url = 5;
  string digest_sri = 6;
}

// GovernanceFrameworkVersionWithDocs is the response shape for the query layer,
// returning a version with its nested documents.
message GovernanceFrameworkVersionWithDocs {
  uint64 id = 1;
  uint64 ecosystem_id = 2;
  uint64 corporation_id = 3;
  google.protobuf.Timestamp created = 4 [
    (gogoproto.stdtime) = true,
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  uint32 version = 5;
  google.protobuf.Timestamp active_since = 6 [
    (gogoproto.stdtime) = true,
    (gogoproto.nullable) = true
  ];
  repeated GovernanceFrameworkDocument documents = 7 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// EcosystemAcceptance is the last version of an ecosystem's governance
// framework a corporation accepted, keyed by (ecosystem_id, corporation_id).
message EcosystemAcceptance {
  uint64 ecosystem_id = 1;
  uint64 corporation_id = 2;
  uint32 version = 3;
  google.protobuf.Timestamp accepted = 4 [
    (gogoproto.stdtime) = true,
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// NetworkGovernance is the network governance group of GlobalVariables the
// module maintains.
message NetworkGovernance {
  // network_governance_framework_versions lists the network framework versions
  // in version order.
  repeated uint64 network_governance_framework_versions = 1;
  // ngf_acceptance_deadline ends the grace period of the last activation.
  google.protobuf.Timestamp ngf_acceptance_deadline = 2 [(gogoproto.stdtime) = true];
}
