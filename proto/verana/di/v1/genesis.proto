syntax = "proto3";
package verana.di.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "verana/di/v1/tx.proto";

option go_package = "github.com/verana-labs/verana-node/x/di/types";

// GenesisState defines the di module's genesis state.
message GenesisState {
  // digests is the list of all stored digests.
  repeated Digest digests = 2 [(gogoproto.nullable) = false];
}
