syntax = "proto3";
package verana.ds.v1;

import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "verana/ds/v1/params.proto";

option go_package = "github.com/verana-labs/verana-node/x/ds/types";

// GenesisState defines the ds module's genesis state.
message GenesisState {
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // counters of the open epoch
  repeated GenesisValidatorBlocks validator_blocks = 2 [(gogoproto.nullable) = false];
  uint64 epoch_blocks = 3;
}

// GenesisValidatorBlocks is a ValidatorBlocks entry with its key.
message GenesisValidatorBlocks {
  string validator_address = 1 [(cosmos_proto.scalar) = "cosmos.ValidatorAddressString"];
  uint64 signed_blocks = 2;
  uint64 member_blocks = 3;
}
