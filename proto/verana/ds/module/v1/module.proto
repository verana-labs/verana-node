syntax = "proto3";
package verana.ds.module.v1;

import "cosmos/app/v1alpha1/module.proto";

option go_package = "github.com/verana-labs/verana-node/x/ds/types";

// Module is the config object for the module.
message Module {
  option (cosmos.app.v1alpha1.module) = {go_import: "github.com/verana-labs/verana-node/x/ds"};

  // authority is the council account.
  string authority = 1;
}
