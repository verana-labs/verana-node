rding process with the ecosystem\n - ISSUER_ONBOARDING_MODE_GRANTOR_ONBOARDING_PROCESS: Requires an onboarding process with a grantor","type":"string","default":"ISSUER_ONBOARDING_MODE_UNSPECIFIED","enum":["ISSUER_ONBOARDING_MODE_UNSPECIFIED","ISSUER_ONBOARDING_MODE_OPEN","ISSUER_ONBOARDING_MODE_ECOSYSTEM_ONBOARDING_PROCESS","ISSUER_ONBOARDING_MODE_GRANTOR_ONBOARDING_PROCESS"]},"verana.cs.v1.MsgArchiveCredentialSchema":{"type":"object","title":"[MOD-CS-MSG-3] Archive Credential Schema","properties":{"archive":{"type":"boolean"},"corporation":{"type":"string","title":"corporation is the group account on whose behalf this message is executed"},"id":{"type":"string","format":"uint64"},"operator":{"type":"string","title":"operator is the account authorized by the corporation to run this Msg"}}},"verana.cs.v1.MsgArchiveCredentialSchemaResponse":{"type":"object"},"verana.cs.v1.MsgCreateCredentialSchema":{"type":"object","title":"[MOD-CS-MSG-1] Create New Credential Schema","properties":{"corporation":{"type":"string","title":"corporation is the group account on whose behalf this message is executed"},"digest_algorithm":{"type":"string"},"ecosystem_id":{"type":"string","format":"uint64"},"holder_onboarding_mode":{"type":"integer","format":"int64"},"holder_validation_validity_period":{"$ref":"#/definitions/verana.cs.v1.OptionalUInt32"},"issuer_grantor_validation_validity_period":{"$ref":"#/definitions/verana.cs.v1.OptionalUInt32"},"issuer_onboarding_mode":{"type":"integer","format":"int64"},"issuer_validation_validity_period":{"$ref":"#/definitions/verana.cs.v1.OptionalUInt32"},"json_schema":{"type":"string"},"operator":{"type":"string","title":"operator is the account authorized by the corporation to run this Msg"},"pricing_asset":{"type":"string"},"pricing_asset_type":{"type":"integer","format":"int64"},"verifier_grantor_validation_validity_period":{"$ref":"#/definitions/verana.cs.v1.OptionalUInt32"},"verifier_onboarding_mode":{"type":"integer","format":"int64"},"verifier_validation_validity_period":{"$ref":"#/definitions/verana.cs.v1.OptionalUInt32"}}},"verana.cs.v1.MsgCreateCredentialSchemaResponse":{"type":"object","properties":{"id":{"type":"string","format":"uint64","title":"ID of the created credential schema for confirmation"}}},"verana.cs.v1.MsgUpdateCredentialSchema":{"type":"object","title":"[MOD-CS-MSG-2] Update Credential Schema","properties":{"corporation":{"type":"string","title":"corporation is the group account on whose behalf this message is executed"},"holder_validation_validity_period":{"$ref":"#/definitions/verana.cs.v1.OptionalUInt32"},"id":{"type":"string","format":"uint64"},"issuer_grantor_validation_validity_period":{"$ref":"#/definitions/verana.cs.v1.OptionalUInt32"},"issuer_validation_validity_period":{"$ref":"#/definitions/verana.cs.v1.OptionalUInt32"},"operator":{"type":"string","title":"operator is the account authorized by the corporation to run this Msg"},"verifier_grantor_validation_validity_period":{"$ref":"#/definitions/verana.cs.v1.OptionalUInt32"},"verifier_validation_validity_period":{"$ref":"#/definitions/verana.cs.v1.OptionalUInt32"}}},"verana.cs.v1.MsgUpdateCredentialSchemaResponse":{"type":"object"},"verana.cs.v1.MsgUpdateParams":{"description":"MsgUpdateParams is the Msg/UpdateParams request type.","type":"object","properties":{"authority":{"description":"authority is the address that controls the module (defaults to x/gov unless overwritten).","type":"string"},"params":{"description":"params defines the module parameters to update.\n\nNOTE: All parameters must be supplied.","$ref":"#/definitions/verana.cs.v1.Params"}}},"verana.cs.v1.MsgUpdateParamsResponse":{"description":"MsgUpdateParamsResponse defines the response structure for executing a\nMsgUpdateParams message.","type":"object"},"verana.cs.v1.OptionalUInt32":{"type":"object","title":"OptionalUInt32 is a wrapper for optional uint32 values","properties":{"value":{"type":"integer","format":"int64"}}},"verana.cs.v1.Params":{"description":"Params defines the parameters for the module.","type":"object","properties":{"credential_schema_holder_validation_validity_period_max_days":{"type":"integer","format":"int64"},"credential_schema_issuer_grantor_validation_validity_period_max_days":{"type":"integer","format":"int64"},"credential_schema_issuer_validation_validity_period_max_days":{"type":"integer","format":"int64"},"credential_schema_schema_max_size":{"type":"string","format":"uint64"},"credential_schema_verifier_grantor_validation_validity_period_max_days":{"type":"integer","format":"int64"},"credential_schema_verifier_validation_validity_period_max_days":{"type":"integer","format":"int64"}}},"verana.cs.v1.PricingAssetType":{"description":"- PRICING_ASSET_TYPE_UNSPECIFIED: Default to prevent accidental omission\n - TU: Trust Unit (non-transferable token for fee definitions)\n - COIN: Native blockchain token or IBC asset\n - FIAT: Fiat currency (off-chain settlement)","type":"string","title":"PricingAssetType defines the type of asset used for paying business fees","default":"PRICING_ASSET_TYPE_UNSPECIFIED","enum":["PRICING_ASSET_TYPE_UNSPECIFIED","TU","COIN","FIAT"]},"verana.cs.v1.QueryGetCredentialSchemaResponse":{"type":"object","properties":{"schema":{"$ref":"#/definitions/verana.cs.v1.CredentialSchema"}}},"verana.cs.v1.QueryListCredentialSchemasResponse":{"type":"object","properties":{"schemas":{"type":"array","items":{"type":"object","$ref":"#/definitions/verana.cs.v1.CredentialSchema"}}}},"verana.cs.v1.QueryParamsResponse":{"description":"QueryParamsResponse is response type for the Query/Params RPC method.","type":"object","properties":{"params":{"description":"params holds all the parameters of this module.","$ref":"#/definitions/verana.cs.v1.Params"}}},"verana.cs.v1.QueryRenderJsonSchemaResponse":{"type":"object","properties":{"schema":{"type":"string"}}},"verana.cs.v1.VerifierOnboardingMode":{"description":"VerifierOnboardingMode defines how verifiers are onboarded for a credential schema.\n\n - VERIFIER_ONBOARDING_MODE_OPEN: Anyone can self-create a verifier permission\n - VERIFIER_ONBOARDING_MODE_ECOSYSTEM_ONBOARDING_PROCESS: Requires an onboarding process with the ecosystem\n - VERIFIER_ONBOARDING_MODE_GRANTOR_ONBOARDING_PROCESS: Requires an onboarding process with a grantor","type":"string","default":"VERIFIER_ONBOARDING_MODE_UNSPECIFIED","enum":["VERIFIER_ONBOARDING_MODE_UNSPECIFIED","VERIFIER_ONBOARDING_MODE_OPEN","VERIFIER_ONBOARDING_MODE_ECOSYSTEM_ONBOARDING_PROCESS","VERIFIER_ONBOARDING_MODE_GRANTOR_ONBOARDING_PROCESS"]},"verana.de.v1.MsgGrantOperatorAuthorization":{"description":"[MOD-DE-MSG-3] MsgGrantOperatorAuthorization grants an operator authorization\nto a grantee on behalf of a corporation.\n\nSigner semantics (spec \"corporation + operator OR group proposal\"):\nThe signer is `operator` (consistent with the other delegable modules).\n- Group-proposal path: the corporation's group policy account executes the\n  message, so `operator` equals `corporation` (the policy_address) and the\n  handler skips AUTHZ-CHECK-1 (the corporation is acting alone).\n- Operator path: an individual `operator` signs; the handler resolves the\n  corporation from `corporation` (AUTHZ-CHECK-5) and runs AUTHZ-CHECK-1 to\n  verify the operator's delegation covers this message type.","type":"object","properties":{"authz_spend_limit":{"description":"authz_spend_limit is the optional maximum spendable amount.","type":"array","items":{"type":"object","$ref":"#/definitions/cosmos.base.v1beta1.Coin"}},"authz_spend_limit_period":{"description":"authz_spend_limit_period is the optional reset period for\nauthz_spend_limit.","type":"string"},"corporation":{"description":"corporation is the policy_address of the corporation granting the authorization.","type":"string"},"expiration":{"description":"expiration is the optional timestamp after which the authorization expires.","type":"string","format":"date-time"},"feegrant_spend_limit":{"description":"feegrant_spend_limit is the optional maximum fee amount. Ignored if\nwith_feegrant is false.","type":"array","items":{"type":"object","$ref":"#/definitions/cosmos.base.v1beta1.Coin"}},"feegrant_spend_limit_period":{"description":"feegrant_spend_limit_period is the optional reset period for\nfeegrant_spend_limit. Ignored if with_feegrant is false.","type":"string"},"grantee":{"description":"grantee is the account that receives the authorization from authority.","type":"string"},"msg_types":{"description":"msg_types is the list of VPR delegable message types for which\nauthorization is granted.","type":"array","items":{"type":"string"}},"operator":{"description":"operator is the signer: an authorized operator, or the corporation's\npolicy_address itself on the group-proposal path.","type":"string"},"with_feegrant":{"description":"with_feegrant indicates whether to also grant a fee allowance.","type":"boolean"}}},"verana.de.v1.MsgGrantOperatorAuthorizationResponse":{"description":"MsgGrantOperatorAuthorizationResponse defines the response for\nMsgGrantOperatorAuthorization.","type":"object"},"verana.de.v1.MsgRevokeOperatorAuthorization":{"description":"[MOD-DE-MSG-4] MsgRevokeOperatorAuthorization revokes an operator\nauthorization for a grantee on behalf of a corporation. Same signer\nsemantics as MsgGrantOperatorAuthorization (see above).","type":"object","properties":{"corporation":{"description":"corporation is the policy_address of the corporation revoking the authorization.","type":"string"},"grantee":{"description":"grantee is the account whose authorization is being revoked.","type":"string"},"operator":{"description":"operator is the signer: an authorized operator, or the corporation's\npolicy_address itself on the group-proposal path.","type":"string"}}},"verana.de.v1.MsgRevokeOperatorAuthorizationResponse":{"description":"MsgRevokeOperatorAuthorizationResponse defines the response for\nMsgRevokeOperatorAuthorization.","type":"object"},"verana.de.v1.MsgUpdateParams":{"description":"MsgUpdateParams is the Msg/UpdateParams request type.","type":"object","properties":{"authority":{"description":"authority is the address that controls the module (defaults to x/gov unless overwritten).","type":"string"},"params":{"description":"params defines the module parameters to update.\n\nNOTE: All parameters must be supplied.","$ref":"#/definitions/verana.de.v1.Params"}}},"verana.de.v1.MsgUpdateParamsResponse":{"description":"MsgUpdateParamsResponse defines the response structure for executing a\nMsgUpdateParams message.","type":"object"},"verana.de.v1.OperatorAuthorization":{"description":"OperatorAuthorization is the operator-delegation record. Per spec it is\nkeyed by its own uint64 id; (corporation_id, operator) is a unique secondary\nindex.","type":"object","properties":{"corporation_id":{"description":"corporation_id is the id of the corporation granting the authorization. The\n(corporation_id, operator) tuple MUST be unique.","type":"string","format":"uint64"},"expiration":{"description":"expiration is the timestamp after which the authorization is no longer\nvalid.","type":"string","format":"date-time"},"id":{"description":"id is the own uint64 key of this OperatorAuthorization.","type":"string","format":"uint64"},"msg_types":{"description":"msg_types is the list of module message types this authorization applies to.","type":"array","items":{"type":"string"}},"operator":{"description":"operator is the account receiving the authorization.","type":"string"},"period":{"description":"period is the reset period for spend_limit. If set, expiration MUST also be set.","type":"string"},"remaining_spend":{"description":"remaining_spend is the runtime balance for spend_limit. Present iff\nspend_limit is set.","type":"array","items":{"type":"object","$ref":"#/definitions/cosmos.base.v1beta1.Coin"}},"spend_limit":{"description":"spend_limit is the maximum amount of funds the grantee is allowed to spend.","type":"array","items":{"type":"object","$ref":"#/defini