versions":{"type":"array","items":{"type":"object","$ref":"#/definitions/verana.gf.v1.GovernanceFrameworkVersionWithDocs"}}}},"verana.co.v1.Member":{"description":"Member is the MOD-CO-local mirror of cosmos.group.v1.MemberRequest. We don't\nimport the x/group proto directly because the buf cosmos-sdk dep pinned by\nthis repo predates the x/group proto export. The Go keeper converts this\ntype to the cosmos.group.v1.MemberRequest before calling x/group.","type":"object","properties":{"address":{"description":"address is the bech32 address of the member.","type":"string"},"metadata":{"description":"metadata is optional arbitrary metadata attached to the member.","type":"string"},"weight":{"description":"weight is the member's voting weight. MUST be a non-zero decimal string\nrepresenting a positive number (e.g. \"1\", \"10\").","type":"string"}}},"verana.co.v1.MsgCreateCorporation":{"description":"MsgCreateCorporation — MOD-CO-MSG-1.\n\nSigner is the submitting account; no privilege required. Forwarded as the\n`admin` field of the underlying `MsgCreateGroupWithPolicy`. After execution,\nthe signer holds no ongoing admin privileges over the group, group policy,\nor Corporation — the group_policy_address becomes the admin of both the\ngroup and the group policy (`group_policy_as_admin` is hardcoded to `true`).","type":"object","properties":{"decision_policy":{"description":"decision_policy must encode a cosmos.group.v1.ThresholdDecisionPolicy or\ncosmos.group.v1.PercentageDecisionPolicy. Passed through to x/group.","$ref":"#/definitions/google.protobuf.Any"},"did":{"description":"did is the DID of the new Corporation. MUST be globally unique.","type":"string"},"doc_digest_sri":{"description":"doc_digest_sri is the digest_sri of the v1 CGF document.","type":"string"},"doc_url":{"description":"doc_url is the URL of the v1 CGF document.","type":"string"},"group_metadata":{"type":"string"},"group_policy_metadata":{"type":"string"},"language":{"description":"language is the